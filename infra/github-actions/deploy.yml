name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'notebooks/**'

env:
  PROJECT_ID: cyclone-anticipatory-platform
  REGION: asia-south1
  SERVICE_NAME: cyclone-backend-api

jobs:
  deploy:
    name: Build & Deploy Container to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/cyclone-repo/backend:${{ github.sha }}"
          docker build -t ${IMAGE_TAG} -f Dockerfile .
          docker push ${IMAGE_TAG}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cyclone-repo/backend:${{ github.sha }}
          flags: '--allow-unauthenticated'
